name: Daily directory fetch

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch directories
        run: npm run fetch
        env:
          # Raises the GitHub API rate limit for the Pay.sh (pay-skills) fetcher.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch ranking (x402scan most-called)
        run: npm run fetch:rank

      - name: Write stats snapshot
        run: node scripts/write-stats-snapshot.mjs

      # Named providers, derived from the FULL catalog — the site imports the
      # artifact because the file it bundles is capped and would understate.
      - name: Write named-providers artifact
        run: node scripts/write-providers.mjs

      - name: Commit updated catalog and snapshot
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/endpoints.json data/endpoints_full.json.gz data/stats data/rank.json data/providers.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: daily directory fetch ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # EVERYTHING the public API serves is frozen at build time: the catalog
      # is an `import` of data/endpoints.json, and data/stats/*.json ships as
      # traced files inside the serverless function, whose filesystem is
      # immutable. `export const dynamic = "force-dynamic"` stops the RESPONSE
      # being cached; it does not re-read either from disk. So a commit here
      # changes nothing the public sees until a new deployment is promoted.
      - name: Trigger Vercel deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK is not set, so this job cannot \
          start a deploy. It is relying on Vercel's Git integration to build \
          the commit just pushed. If production does not move, that is where \
          to look — the verify step below is what catches it."
            exit 0
          fi
          echo "Triggering Vercel deploy hook…"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK")
          echo "Deploy hook responded HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Vercel deploy hook failed (HTTP $code)."
            exit 1
          fi

      # Between 2026-09-30 and 2026-10-07 the catalog grew 118,470 -> 131,675
      # and every one of those runs passed, because a green run only ever
      # proved the COMMIT landed. Nothing checked the thing users actually
      # read. Ask production for its own number and compare.
      #
      # A deploy takes minutes, so poll rather than check once. Set
      # PUBLIC_SITE_URL as a repository variable to point this elsewhere.
      - name: Verify production serves the new catalog
        if: steps.commit.outputs.changed == 'true'
        env:
          SITE: ${{ vars.PUBLIC_SITE_URL || 'https://x402endpoint.com' }}
        run: |
          expected=$(node -e 'process.stdout.write(String(require("./data/endpoints.json").full_count))')
          echo "Committed full_count: $expected"
          echo "Polling $SITE/api/stats for up to 15 minutes…"
          served=""
          for i in $(seq 1 30); do
            body=$(curl -fsS -m 30 "$SITE/api/stats" 2>/dev/null || true)
            if [ -n "$body" ]; then
              served=$(printf '%s' "$body" | node -e '
                let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                  try { process.stdout.write(String(JSON.parse(s).total)); }
                  catch { process.stdout.write(""); }
                });' || true)
              echo "  attempt $i: total=${served:-<unparseable>}"
              [ "$served" = "$expected" ] && break
            else
              echo "  attempt $i: no response"
            fi
            sleep 30
          done
          {
            echo "### Production check"
            echo
            echo "| | value |"
            echo "| --- | --- |"
            echo "| site | \`$SITE\` |"
            echo "| committed \`full_count\` | $expected |"
            echo "| served \`total\` | ${served:-(none)} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$served" != "$expected" ]; then
            echo "::error::Production still serves total=${served:-<none>} but \
          the committed catalog holds $expected. The data is correct in git and \
          stale on the site, so the gap is the deployment, not the fetch. Check \
          which deployment $SITE is aliased to, and set VERCEL_DEPLOY_HOOK if \
          Vercel's Git integration is not building these commits."
            exit 1
          fi
          echo "Production serves $served — matches the commit."

      - name: Report failure
        if: failure()
        run: echo "::error::Daily fetch/snapshot job failed — catalog or stats snapshot was not updated."
